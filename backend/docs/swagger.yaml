        in: body
        name: description
        schema:
          type: string
      - description: Жанр книги
        example: Роман
        in: body
        name: genre
        schema:
          type: string
      - description: ISBN книги
        example: 978-3-16-148410-0
        in: body
        name: isbn
        schema:
          type: string
      - description: Язык книги
        example: Русский
        in: body
        name: language
        schema:
          type: string
      - description: Количество страниц в книге
