definitions:
  big.Int:
    type: object
  db.Book:
    properties:
      author:
        type: string
      cover_type:
        $ref: '#/definitions/pgtype.Text'
      description:
        $ref: '#/definitions/pgtype.Text'
      genre:
        type: string
      id:
        type: string
      isbn:
        type: string
      language:
        $ref: '#/definitions/pgtype.Text'
      page_count:
        $ref: '#/definitions/pgtype.Numeric'
      publisher:
        type: string
      title:
        type: string
      year:
        $ref: '#/definitions/pgtype.Numeric'
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
      explanation:
        type: string
    type: object
  pgtype.InfinityModifier:
    enum:
    - 1
    - 0
    - -1
    format: int32
    type: integer
    x-enum-varnames:
    - Infinity
    - Finite
    - NegativeInfinity
  pgtype.Numeric:
    properties:
      exp:
        format: int32
        type: integer
      infinityModifier:
        $ref: '#/definitions/pgtype.InfinityModifier'
      int:
        $ref: '#/definitions/big.Int'
      naN:
        type: boolean
      valid:
        type: boolean
    type: object
  pgtype.Text:
    properties:
      string:
        type: string
      valid:
        type: boolean
    type: object
info:
  contact: {}
paths:
  /api/books:
    get:
      consumes:
      - text/plain
      description: Вывести список книг, хранящихся на сервере.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.Book'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Список книг
      tags:
      - Книги
    post:
      consumes:
      - application/json
      description: Создаёт новую книгу.
      parameters:
      - description: Полное имя автора
        example: Известный автор
        in: body
        name: author
        required: true
        schema:
          type: string
      - description: Тип обложки (твёрдая, мягкая)
        example: твёрдая
        in: body
        name: cover_type
        schema:
          type: string
      - description: Описание книги
        example: Крайне интересная книга об очень интересных вещах
        in: body
        name: description
        schema:
          type: string
      - description: Жанр книги
        example: Роман
        in: body
        name: genre
        required: true
        schema:
          type: string
      - description: ISBN книги
        example: 978-3-16-148410-0
        in: body
        name: isbn
        required: true
        schema:
          type: string
      - description: Язык книги
        example: Русский
        in: body
        name: language
        schema:
          type: string
      - description: Количество страниц в книге
        example: 100
        in: body
        name: page_count
        schema:
          type: integer
      - description: Издательство книги
        example: Хороший Издатель
        in: body
        name: publisher
        required: true
        schema:
          type: string
      - description: Название книги
        example: Интересная книга
        in: body
        name: title
        required: true
        schema:
          type: string
      - description: Год выпуска книги
        example: 2026
        in: body
        name: year
        schema:
          type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/db.Book'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Создать книгу
      tags:
      - Книги
  /api/books/{uuid}:
    delete:
      consumes:
      - text/plain
      description: Удалить книгу из базы данных.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Удалить книгу
      tags:
      - Книги
    get:
      consumes:
      - text/plain
      description: Получить информацию о книге.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.Book'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Получить  книгу
      tags:
      - Книги
    patch:
      consumes:
      - application/json
      description: Изменить информацию о существующей книге.
      parameters:
      - description: Полное имя автора
        example: Известный автор
        in: body
        name: author
        schema:
          type: string
      - description: Тип обложки (твёрдая, мягкая)
        example: твёрдая
        in: body
        name: cover_type
        schema:
          type: string
      - description: Описание книги
        example: Крайне интересная книга об очень интересных вещах
        in: body
        name: description
        schema:
          type: string
      - description: Жанр книги
        example: Роман
        in: body
        name: genre
        schema:
          type: string
      - description: ISBN книги
        example: 978-3-16-148410-0
        in: body
        name: isbn
        schema:
          type: string
      - description: Язык книги
        example: Русский
        in: body
        name: language
        schema:
          type: string
      - description: Количество страниц в книге
        example: 100
        in: body
        name: page_count
        schema:
          type: integer
      - description: Издательство книги
        example: Хороший Издатель
        in: body
        name: publisher
        schema:
          type: string
      - description: Название книги
        example: Интересная книга
        in: body
        name: title
        schema:
          type: string
      - description: Год выпуска книги
        example: 2026
        in: body
        name: year
        schema:
          type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.Book'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Изменить книгу
      tags:
      - Книги
  /api/books/search:
    get:
      consumes:
      - application/json
      description: Найти книги, соответствующие поисковым параметрам.
      parameters:
      - description: Лимит количества возвращаемых элементов
        example: 10
        in: query
        name: limit
        type: integer
      - description: Смещение возвращаемых элементов
        example: 5
        in: query
        name: offset
        type: integer
      - description: Полное имя автора
        example: Известный автор
        in: query
        name: author
        type: string
      - description: Жанр книги
        example: Роман
        in: body
        name: genre
        schema:
          type: string
      - description: Язык книги
        example: Русский
        in: body
        name: language
        schema:
          type: string
      - description: Издательство книги
        example: Хороший Издатель
        in: body
        name: publisher
        schema:
          type: string
      - description: Название книги
        example: Интересная книга
        in: body
        name: title
        schema:
          type: string
      - description: Год выпуска книги
        example: 2026
        in: body
        name: year
        schema:
          type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.Book'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Найти книги
      tags:
      - Книги
swagger: "2.0"
