version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/*.sql"
    schema: "schema.sql"
    gen:
      go:
        package: "db"
        out: "db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        overrides:
          - column: users.hash
            go_struct_tag: json:"-"
          - column: users.salt
            go_struct_tag: json:"-"
