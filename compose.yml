name: housebook

configs:
  caddy:
    file: Caddyfile

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    ports:
      - 5432:5432
    volumes:
      - db:/var/lib/postgresql
    networks:
      - back

  backend:
    image: golang:1.25
    restart: on-failure
    env_file: .env
    depends_on:
      - db
    build: backend
    networks:
      - back
      - front

  frontend:
    image: node:25
    restart: on-failure
    depends_on:
      - backend
    build: frontend
    develop:
      watch:
        - action: sync
          path: frontend
          target: /usr/src/housebook
    networks:
      - front

  proxy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    configs:
      - source: caddy
        target: /etc/caddy/Caddyfile      
    ports:
      - 80:80
      - 443:443/tcp
      - 443:443/udp
    networks:
      - front

volumes:
  db:

networks:
  back:
  front:
