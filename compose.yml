name: housebook

configs:
  caddy:
    file: Caddyfile

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    ports:
      - 5432:5432
    volumes:
      - db:/var/lib/postgresql
    hostname: db
    networks:
      - back

  storage:
    image: housebook-storage
    restart: on-failure
    env_file: .env
    build: storage
    volumes:
      - storage:/var/lib/storage
    hostname: storage
    networks:
      - back
      - front

  scraper:
    image: housebook-scraper
    restart: on-failure
    env_file: .env
    build: scraper
    hostname: scraper
    networks:
      - front

  backend:
    image: housebook-backend
    restart: on-failure
    env_file: .env
    depends_on:
      - db
      - storage
    build: backend
    hostname: backend
    networks:
      - back
      - front

  frontend:
    image: housebook-frontend
    restart: on-failure
    depends_on:
      - backend
      - storage
    build: frontend
    develop:
      watch:
        - action: sync
          path: frontend
          target: /usr/src/housebook
    networks:
      - front

  proxy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - storage
    configs:
      - source: caddy
        target: /etc/caddy/Caddyfile
    ports:
      - 80:80
      - 443:443/tcp
      - 443:443/udp
    networks:
      - front

volumes:
  db:
  storage:

networks:
  back:
  front:
